services:
  excalidraw:
    build:
      context: ./excalidraw
      dockerfile: ../docker/excalidraw/Dockerfile
      args:
        VITE_APP_WS_SERVER_URL: http://localhost:9248
    ports:
      - "127.0.0.1:9247:80"
    restart: unless-stopped

  excalidraw-room:
    build:
      context: ./excalidraw-room
      dockerfile: ../docker/excalidraw-room/Dockerfile
    ports:
      - "127.0.0.1:9248:80"
    restart: unless-stopped

  excalidraw-mcp:
    build:
      context: ./excalidraw-mcp
      dockerfile: ../docker/excalidraw-mcp/Dockerfile
    ports:
      - "127.0.0.1:9250:3001"
    volumes:
      - excalidraw-mcp-checkpoints:/tmp/excalidraw-mcp-checkpoints
    restart: unless-stopped

volumes:
  excalidraw-mcp-checkpoints:
