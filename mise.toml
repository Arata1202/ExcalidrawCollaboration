[tasks.up]
description = "Start services and renew the SSL certificate"
run = [
  "docker compose up -d",
  { task = "renew" },
]

[tasks.deploy]
description = "Build and start services, then renew the SSL certificate"
run = [
  "docker compose up -d --build",
  { task = "renew" },
]

[tasks.renew]
description = "Renew the SSL certificate and reload Nginx"
run = "sudo certbot renew --deploy-hook 'docker compose exec -T nginx nginx -s reload'"
